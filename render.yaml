services:
  - type: web
    name: actormodelruntime
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: K8S_MODE
        value: simulator
      - key: RUNTIME_MODE
        value: render
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
